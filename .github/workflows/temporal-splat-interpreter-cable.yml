name: temporal-splat-interpreter-cable

on:
  push:
    branches:
      - build/temporal-splat-interpreter-cable-v0.1
    paths:
      - cgg-runtime/crates/cgg-temporal-adapter/**
      - cgg-runtime/contracts/temporal-splat-interpreter-cable-v1.schema.json
      - cgg-runtime/skills/covenant-splat/**
      - .github/workflows/temporal-splat-interpreter-cable.yml
  pull_request:
    paths:
      - cgg-runtime/crates/cgg-temporal-adapter/**
      - cgg-runtime/contracts/temporal-splat-interpreter-cable-v1.schema.json
      - cgg-runtime/skills/covenant-splat/**
      - .github/workflows/temporal-splat-interpreter-cable.yml

permissions:
  contents: read

concurrency:
  group: temporal-splat-interpreter-cable-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: cgg-runtime/crates/cgg-temporal-adapter/Cargo.toml

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Tests
        run: cargo test --manifest-path "$MANIFEST"
      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

  python-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run deterministic lowering oracle
        run: python3 cgg-runtime/skills/covenant-splat/scripts/lower-covenant-expr.py --selftest

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse adapter schema
        run: python3 -m json.tool cgg-runtime/contracts/temporal-splat-interpreter-cable-v1.schema.json >/dev/null

  exact-mount-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CGG review head
        uses: actions/checkout@v4
        with:
          path: cgg
          persist-credentials: false
      - name: Checkout exact canonical-mount review head
        uses: actions/checkout@v4
        with:
          repository: prompted365/canonical-mount
          ref: dc39e5ece674cb4500848ff343674643c2795d05
          path: canonical-mount
          persist-credentials: false
      - name: Build exact canonical-mount binary
        run: cargo build --manifest-path canonical-mount/Cargo.toml -p canonical-mount-core
      - name: Exercise request → mount bytes → verified proposal
        env:
          CANONICAL_MOUNT_BIN: ${{ github.workspace }}/canonical-mount/target/debug/canonical-mount
          CANONICAL_MOUNT_EXPECTED_COMMIT: dc39e5ece674cb4500848ff343674643c2795d05
        run: |
          cargo test \
            --manifest-path cgg/cgg-runtime/crates/cgg-temporal-adapter/Cargo.toml \
            --test cable exact_canonical_mount_binary_closes_binding -- --exact
