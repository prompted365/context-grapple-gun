name: temporal-splat-interpreter-cable

on:
  push:
    branches:
      - build/temporal-splat-interpreter-cable-v0.1
    paths:
      - cgg-runtime/crates/cgg-temporal-adapter/**
      - cgg-runtime/contracts/temporal-splat-interpreter-cable-v1.schema.json
      - cgg-runtime/skills/covenant-splat/**
      - .github/workflows/temporal-splat-interpreter-cable.yml
  pull_request:
    paths:
      - cgg-runtime/crates/cgg-temporal-adapter/**
      - cgg-runtime/contracts/temporal-splat-interpreter-cable-v1.schema.json
      - cgg-runtime/skills/covenant-splat/**
      - .github/workflows/temporal-splat-interpreter-cable.yml

permissions:
  contents: write

concurrency:
  group: temporal-splat-interpreter-cable-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: cgg-runtime/crates/cgg-temporal-adapter/Cargo.toml

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/temporal-splat-interpreter-cable-v0.1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply review corrections
        run: python .github/scripts/materialize_temporal_interpreter.py
      - name: Materialize Rust formatting and lockfile
        run: |
          cargo fmt --manifest-path "$MANIFEST"
          cargo generate-lockfile --manifest-path "$MANIFEST"
      - name: Commit exact code outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "homeskillet-oa55"
          git config user.email "noreply@prompted.community"
          git add cgg-runtime/crates/cgg-temporal-adapter
          if git diff --cached --quiet; then
            echo "No materialized code changes"
            exit 0
          fi
          git commit -m "Materialize and harden the CGG temporal interpreter cable"
          git pull --rebase origin build/temporal-splat-interpreter-cable-v0.1
          git push origin HEAD:build/temporal-splat-interpreter-cable-v0.1

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Tests
        run: cargo test --manifest-path "$MANIFEST"
      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings

  python-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run deterministic lowering oracle
        run: python3 cgg-runtime/skills/covenant-splat/scripts/lower-covenant-expr.py --selftest

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse adapter schema
        run: python3 -m json.tool cgg-runtime/contracts/temporal-splat-interpreter-cable-v1.schema.json >/dev/null
