name: Apply v5 sync contract repair

on:
  push:
    branches:
      - fix/distribution-currentness-v5
    paths:
      - 'scripts/apply-v5-sync-repair.py'
      - '.github/workflows/apply-v5-sync-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/distribution-currentness-v5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply the receipt/tree sync migration
        run: python3 scripts/apply-v5-sync-repair.py
      - name: Validate migrated branch
        run: |
          npm ci
          npm run test:distribution
          npm pack --dry-run
      - name: Commit and push the self-deleting migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'distribution: bind sync to receipt and package tree integrity'
          git push origin HEAD:fix/distribution-currentness-v5
