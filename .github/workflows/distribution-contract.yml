name: Distribution contract

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'hooks/**'
      - 'cgg-runtime/skills/**'
      - 'bin/**'
      - 'lib/**'
      - 'scripts/validate-distribution.mjs'
      - 'tests/npm/**'
      - 'package.json'
      - 'package-lock.json'
      - 'SESSION_LEARNING_PROTOCOL.md'
      - 'README.md'
      - 'START-HERE.md'
      - 'INSTALL.md'
      - 'docs/**'
      - '.github/workflows/distribution-contract.yml'
      - '.github/workflows/release-npm.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'hooks/**'
      - 'cgg-runtime/skills/**'
      - 'bin/**'
      - 'lib/**'
      - 'scripts/validate-distribution.mjs'
      - 'tests/npm/**'
      - 'package.json'
      - 'package-lock.json'
      - 'SESSION_LEARNING_PROTOCOL.md'
      - 'README.md'
      - 'START-HERE.md'
      - 'INSTALL.md'
      - 'docs/**'
      - '.github/workflows/distribution-contract.yml'
      - '.github/workflows/release-npm.yml'

permissions:
  contents: read

jobs:
  node-contract:
    name: Node ${{ matrix.node }} contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:distribution
      - run: npm pack --dry-run

  claude-plugin-contract:
    name: Current Claude Code strict validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install current Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@latest
      - name: Validate marketplace and plugin
        run: claude plugin validate . --strict
