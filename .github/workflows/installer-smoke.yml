name: Clean packaged installer lifecycle

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - '.github/workflows/installer-smoke.yml'
      - 'bin/**'
      - 'cgg-runtime/**'
      - 'hooks/**'
      - 'lib/**'
      - 'assets/**'
      - 'docs/**'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'CGG_RUNTIME_TOPOLOGY_AND_LIFECYCLE.md'
      - 'DEV-README.md'
      - 'INSTALL.md'
      - 'LICENSE'
      - 'README.md'
      - 'START-HERE.md'
      - 'package.json'
      - 'package-lock.json'
      - 'release-status.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-smoke:
    name: Packed tarball × scopes × modes × update × sync × uninstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install current Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@latest
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          claude --version
      - name: Pack and install the exact npm artifact
        id: pack
        run: |
          set -euo pipefail
          npm pack --json > "$RUNNER_TEMP/cgg-pack.json"
          TARBALL="$(node -e "const x=require(process.argv[1]); process.stdout.write(x[0].filename)" "$RUNNER_TEMP/cgg-pack.json")"
          test -f "$TARBALL"
          node -e "const x=require(process.argv[1]);const bad=x[0].files.filter(f=>/(^|\/)__pycache__\/|\.py[co]$|(^|\/)\.pytest_cache\//.test(f.path));if(bad.length){console.error('Transient Python cache entered tarball:',bad);process.exit(1)}" "$RUNNER_TEMP/cgg-pack.json"
          PREFIX="$RUNNER_TEMP/cgg-prefix"
          npm install --prefix "$PREFIX" "$GITHUB_WORKSPACE/$TARBALL"
          test -x "$PREFIX/node_modules/.bin/cgg"
          echo "tarball=$GITHUB_WORKSPACE/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "cgg_bin=$PREFIX/node_modules/.bin/cgg" >> "$GITHUB_OUTPUT"
      - name: Exercise packed lifecycle
        env:
          CGG_BIN: ${{ steps.pack.outputs.cgg_bin }}
          CGG_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail

          init_project() {
            local project="$1"
            mkdir -p "$project"
            git -C "$project" init
            git -C "$project" config user.email "ci@prompted.local"
            git -C "$project" config user.name "CGG CI"
          }

          assert_zone_survives() {
            local project="$1"
            test -f "$project/.ticzone"
            test -f "$project/.ticignore"
            test -d "$project/audit-logs"
            test -f "$project/CLAUDE.md"
          }

          expect_sync_failure() {
            local target="$1"
            if "$CGG_BIN" sync check --target "$target"; then
              echo "expected sync check to fail for a damaged runtime" >&2
              exit 1
            fi
          }

          exercise_full_scope() {
            local scope="$1"
            local suffix="$2"
            local home="$RUNNER_TEMP/cgg-home-$suffix"
            local project="$RUNNER_TEMP/cgg-project-$suffix"
            local target="$RUNNER_TEMP/cgg-target-$suffix"
            mkdir -p "$home"
            init_project "$project"
            (
              export HOME="$home"
              cd "$project"
              "$CGG_BIN" install --mode full --scope "$scope" --target "$target"
              "$CGG_BIN" doctor --target "$target"
              "$CGG_BIN" sync check --target "$target"
              "$CGG_BIN" install --mode full --scope "$scope" --target "$target"
              "$CGG_BIN" doctor --target "$target"
              "$CGG_BIN" sync check --target "$target"
              "$CGG_BIN" uninstall --scope "$scope" --target "$target" --keep-data
            )
            test ! -e "$target"
            assert_zone_survives "$project"
          }

          # Explicit scope contract literals for static audit: --scope user, --scope project, --scope local.
          exercise_full_scope user user
          exercise_full_scope project project

          # Local scope also proves materialized-agent drift, governed repair,
          # full -> skills contraction, mode-aware sync, and zero-hook isolation.
          HOME_LOCAL="$RUNNER_TEMP/cgg-home-local"
          PROJECT_LOCAL="$RUNNER_TEMP/cgg-project-local"
          TARGET_LOCAL="$RUNNER_TEMP/cgg-target-local"
          mkdir -p "$HOME_LOCAL"
          init_project "$PROJECT_LOCAL"
          (
            export HOME="$HOME_LOCAL"
            cd "$PROJECT_LOCAL"
            "$CGG_BIN" install --mode full --scope local --target "$TARGET_LOCAL"
            "$CGG_BIN" doctor --target "$TARGET_LOCAL"
            "$CGG_BIN" sync check --target "$TARGET_LOCAL"

            printf '\n# deliberate sync drift\n' >> "$TARGET_LOCAL/agents/mogul.md"
            expect_sync_failure "$TARGET_LOCAL"

            "$CGG_BIN" sync sync --target "$TARGET_LOCAL"
            "$CGG_BIN" doctor --target "$TARGET_LOCAL"
            "$CGG_BIN" sync check --target "$TARGET_LOCAL"

            "$CGG_BIN" install --mode skills --scope local --target "$TARGET_LOCAL"
            test ! -e "$TARGET_LOCAL/agents"
            test ! -e "$TARGET_LOCAL/hooks"
            "$CGG_BIN" doctor --target "$TARGET_LOCAL"
            "$CGG_BIN" sync check --target "$TARGET_LOCAL"

            mkdir -p "$TARGET_LOCAL/hooks"
            printf '#!/usr/bin/env sh\n' > "$TARGET_LOCAL/hooks/rogue.sh"
            expect_sync_failure "$TARGET_LOCAL"
            rm -rf "$TARGET_LOCAL/hooks"
            "$CGG_BIN" sync check --target "$TARGET_LOCAL"

            "$CGG_BIN" uninstall --scope local --target "$TARGET_LOCAL" --keep-data
          )
          test ! -e "$TARGET_LOCAL"
          assert_zone_survives "$PROJECT_LOCAL"

          # Convention mode mutates only the project CLAUDE.md and is detected
          # without a plugin target.
          HOME_CONVENTION="$RUNNER_TEMP/cgg-home-convention"
          PROJECT_CONVENTION="$RUNNER_TEMP/cgg-project-convention"
          mkdir -p "$HOME_CONVENTION"
          init_project "$PROJECT_CONVENTION"
          (
            export HOME="$HOME_CONVENTION"
            cd "$PROJECT_CONVENTION"
            "$CGG_BIN" install --mode convention
            "$CGG_BIN" doctor
          )
          test -f "$PROJECT_CONVENTION/CLAUDE.md"
          test ! -e "$PROJECT_CONVENTION/.ticzone"
          test ! -e "$PROJECT_CONVENTION/audit-logs"
